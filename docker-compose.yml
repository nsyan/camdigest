# 对齐 docs/architecture.md §3：主应用 + insightface sidecar 双容器
services:
  camdigest:
    image: ghcr.io/nsyan/camdigest:latest   # CI 自动构建（推 main 触发）；本地构建：docker build -f docker/Dockerfile -t camdigest:latest .
    volumes:
      - /vol1/nvr:/media/nvr:ro        # 5 机位录像根目录（只读）——按真机转存路径改左侧
      - ./data:/data                    # 产物 + SQLite + 人脸库
      - ./config:/app/config
      - ./cache:/root/.cache            # faster-whisper/HF 模型缓存（避免重建容器重新下载）
    ports:
      - "8080:8080"                     # Web UI（LAN 点播/进度/补跑/人脸库）
    depends_on: [insightface]
    restart: unless-stopped

  insightface:
    image: sthphoenix/insightface-rest
    environment: [USE_ONNX=1]          # CPU 模式，无 TensorRT
    volumes:
      - ./models/insightface:/models   # buffalo_l 模型缓存
    restart: unless-stopped
