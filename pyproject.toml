[project]
name = "camdigest"
version = "0.1.0"
description = "4 设备 5 机位家庭监控录像 → 每日精华 + 飞书日报"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "sqlalchemy>=2.0.30",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
cv = ["ultralytics>=8.2", "faster-whisper>=1.0", "numpy>=1.26"]
dev = ["pytest>=8", "ruff>=0.4", "numpy>=1.26"]

[project.scripts]
camdigest = "camdigest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camdigest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not heavy'"
markers = ["heavy: 需要下载模型或真实凭据，默认跳过"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
